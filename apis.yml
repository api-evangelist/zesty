    type: JSONSchema
  - url: json-schema/field.json
    type: JSONSchema
  description: >-
    The Zesty.io Instances API is a REST API that allows CRUD operations on Zesty.io instances. It provides
    access to content models, content items, fields, views, stylesheets, scripts, settings, head tags,
    navigation, audits, and publishing operations. Each instance is identified by a unique ZUID.
